# apple-storefront-clone — optional local PostgreSQL 17 via Docker.
#
# This is the ALTERNATIVE to the rootless install (docs/setup_pg_z.sh,
# primary method — see docs/DEPLOYMENT.md §4). The credentials/port match the
# rootless contract exactly (postgresql://postgres:postgres@127.0.0.1:5432/
# app_db); the port is bound to loopback only — postgres:postgres must never
# be network-reachable. Run ONE of the two methods, not both.
#
#   Start:   docker compose up -d
#   Stop:    docker compose down
#   Reset:   docker compose down -v  (WARNING: deletes all data)
#   Logs:    docker compose logs -f postgres

services:

  # ─── PostgreSQL 17 ───────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: applestorefront_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

# ─── Named Volumes ─────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
